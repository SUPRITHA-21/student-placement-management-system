<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
        }

        .header {
            background-color: #243b55;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #cccccc;
        }

        h2 {
            color: #243b55;
        }

        .btn {
            display: inline-block;
            background-color: #243b55;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Placement System</h1>
        <p>Student Dashboard</p>
    </div>

    <div class="container">

        <div class="card">
            <h2>Welcome, Student!</h2>
            <p>Welcome to your placement dashboard.</p>
        </div>

        <div class="card">
            <h2>My Profile</h2>
            <p>View your student details.</p>
        </div>

        <div class="card">
            <h2>Placement Opportunities</h2>
            <p>Explore job and placement opportunities.</p>
        </div>

        <div class="card">
            <h2>Application Status</h2>
            <p>Track your placement applications here.</p>
        </div>

        <a class="btn" href="/">Back to Home</a>

    </div>

</body>
</html>
